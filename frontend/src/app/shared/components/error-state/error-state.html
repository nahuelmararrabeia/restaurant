<div
    class="rounded-xl border border-red-200 bg-red-50 px-6 py-5 mb-4"
>
    <p class="font-medium text-red-700">
    {{ text() }}
    </p>

    @if ((buttonText() || buttonIcon()) && onClickButton) {
        <button
            type="button"
            class="mt-3 inline-flex items-center gap-1.5 text-sm font-semibold text-red-700"
            [attr.aria-label]="buttonText() || 'Close'"
            (click)="onClickButton.emit()"
        >
          @if (buttonIcon()) {
            <ng-icon [name]="buttonIcon()!" class="text-lg" />
          }
          @if (buttonText()) {
            <span class="underline">{{ buttonText() }}</span>
          }
        </button>
    }
</div>
