<div
    class="rounded-xl border border-red-200 bg-red-50 px-6 py-5"
>
    <p class="font-medium text-red-700">
    {{ text() }}
    </p>

    @if (buttonText() && onClickButton) {
        <button
            type="button"
            class="mt-3 text-sm font-semibold text-red-700 underline"
            (click)="onClickButton.emit()"
        >
        {{ buttonText() }}
        </button>
    }
</div>
