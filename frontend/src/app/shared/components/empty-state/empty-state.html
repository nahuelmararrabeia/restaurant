<div
  class="bg-white px-6 text-center"
  [class.rounded-xl]="!compact()"
  [class.border]="!compact()"
  [class.border-dashed]="!compact()"
  [class.border-slate-300]="!compact()"
  [class.py-16]="!compact()"
  [class.py-14]="compact()"
>
  @if (icon()) {
    <div
      class="mx-auto flex size-12 items-center justify-center rounded-full bg-slate-100 text-slate-500"
      aria-hidden="true"
    >
      <ng-icon [name]="icon()!" class="text-2xl" />
    </div>
  }

  <h2
    class="font-semibold text-slate-900"
    [class.mt-4]="icon()"
  >
    {{ title() }}
  </h2>

  @if (subtitle()) {
    <p class="mt-1 text-sm text-slate-500">
    {{ subtitle() }}
    </p>
  }

  @if (buttonLink() && buttonText()) {
    <a
      [routerLink]="buttonLink()"
      class="mt-5 inline-flex rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700"
    >
      {{ buttonText() }}
    </a>
  }
</div>
