<div
  class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition-shadow hover:shadow-md"
>
  <div class="flex items-center justify-between gap-4">
    <div class="min-w-0">
      <p class="truncate text-sm font-medium text-slate-500">
        {{ title() }}
      </p>

      <p class="mt-2 text-3xl font-bold text-slate-800">
        {{ value() }}
      </p>
    </div>

    <div
      class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full"
      [ngClass]="{
        'bg-blue-100 text-blue-700': color() === 'blue',
        'bg-green-100 text-green-700': color() === 'green',
        'bg-amber-100 text-amber-700': color() === 'amber',
        'bg-red-100 text-red-700': color() === 'red',
        'bg-purple-100 text-purple-700': color() === 'purple'
      }"
    >
      <ng-icon
        [name]="icon()"
        size="28"
        aria-hidden="true"
      />
    </div>
  </div>
</div>
