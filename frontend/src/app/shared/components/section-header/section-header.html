<header
    class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
  >
    <div>
      <h1 class="text-2xl font-bold text-slate-900">
        {{ title() }}
      </h1>

      @if(subtitle()) {
          <p class="mt-1 text-sm text-slate-500">
            {{ subtitle() }}
          </p>
      }
    </div>

    @if(actionText() && actionLink()) {
        <a
          [routerLink]="actionLink()"
          class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-blue-700"
        >
          {{ actionText() }}
        </a>
    }
  </header>
