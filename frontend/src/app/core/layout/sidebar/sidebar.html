<div class="flex h-full flex-col">

    <!-- Logo -->

    <div class="border-b border-slate-200 p-6">

        <h1 class="text-xl font-bold text-slate-800">
            🍔 Restaurant
        </h1>

        <p class="mt-1 text-sm text-slate-500">
            Management System
        </p>

    </div>

    <!-- Navigation -->

    <nav class="flex-1 overflow-y-auto p-4">

        <ul class="space-y-1">

            @for (item of navigation; track item.route) {

                <li>

                    <a
                        [routerLink]="item.route"
                        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
                        routerLinkActive="bg-blue-50 text-blue-700"
                        class="flex items-center gap-3 rounded-lg px-4 py-3 font-medium text-slate-700 transition-colors hover:bg-slate-100"
                        (click)="close.emit()">

                        <span class="text-xl">
                            {{ item.icon }}
                        </span>

                        <span class="flex-1">
                            {{ item.label }}
                        </span>

                        @if (item.badge) {
                            <span
                                class="rounded-full bg-red-500 px-2 py-0.5 text-xs font-semibold text-white">

                                {{ item.badge }}

                            </span>
                        }

                    </a>

                </li>

            }

        </ul>

    </nav>

    <!-- Footer -->

    <div class="border-t border-slate-200 p-4">

        <p class="text-center text-xs text-slate-400">
            Restaurant Manager v1.0
        </p>

    </div>

</div>
