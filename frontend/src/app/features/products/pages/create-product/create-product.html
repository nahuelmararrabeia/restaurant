<section class="mx-auto max-w-3xl space-y-6">
  <subsection-header
    title="Create product"
    subtitle="Add a new product to the restaurant menu."
    backButtonText="Go back to Products"
    (onBackButtonClick)="cancel()"
  />

  @if (error()) {
    <error-state [text]="error()" />
  }

  <div
    class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
  >
    <product-form
      [loading]="saving()"
      (save)="createProduct($event)"
      (cancel)="cancel()"
    />
  </div>
</section>
