<section class="mx-auto max-w-3xl space-y-6">
  <subsection-header
    title="Edit product"
    subtitle="Change product info."
    backButtonText="Go back to Products"
    (onBackButtonClick)="cancel()"
  />

  @if (loading()) {
    <loading-state text="Cargando producto..." />
  } @else if (loadError()) {
    <error-state 
      [text]="loadError()"
      buttonText="Retry"
      (onClickButton)="retry()"
    />
  } @else if (product(); as currentProduct) {
    @if (saveError()) {
      <error-state [text]="saveError()" />
    }

    <div
      class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
    >
      <product-form
        [initialValue]="currentProduct"
        [loading]="saving()"
        (save)="updateProduct($event)"
        (cancel)="cancel()"
      />
    </div>
  }
</section>
