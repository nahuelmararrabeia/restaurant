<section class="space-y-6">
  <section-header
    title="Products"
    subtitle="Manage the products available in your restaurant."
    actionText="Add product"
    [actionLink]="['/products', 'new']"
  />

  @if (loading()) {
    <loading-state text="Loading products..." />
  } @else if (error()) {
    <error-state
      [text]="error()"
      buttonText="Try again"
      (onClickButton)="loadProducts()"
      />
  } @else if (products().length === 0) {
    <div
      class="rounded-xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center"
    >
      <h2 class="font-semibold text-slate-900">
        No products yet
      </h2>

      <p class="mt-1 text-sm text-slate-500">
        Create your first product to start building the menu.
      </p>

      <a
        routerLink="/products/new"
        class="mt-5 inline-flex rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700"
      >
        Create product
      </a>
    </div>
  } @else {
    <div
      class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
    >
      <div class="overflow-x-auto">

        <products-table [products]="products()" />
      </div>
    </div>
  }
</section>
