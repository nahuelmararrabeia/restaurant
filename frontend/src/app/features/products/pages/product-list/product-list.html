<section class="space-y-6">
  <section-header
    title="Products"
    subtitle="Manage the products available in your restaurant."
    actionText="Add product"
    [actionLink]="['/products', 'new']"
  />

  @if (actionError()) {
    <error-state
      [text]="actionError()"
      buttonIcon="heroXMark"
      (onClickButton)="clearActionError()"
    />
  }

  @if (loading()) {
    <loading-state text="Loading products..." />
  } @else if (error()) {
    <error-state
      [text]="error()"
      buttonText="Try again"
      (onClickButton)="loadProducts()"
      />
  } @else if (products().length === 0) {
    <empty-state
      title="No products yet"
      subtitle="Create your first product to start building the menu."
      buttonText="Create product"
      [buttonLink]="['/products', 'new']"
    />
  } @else {
    <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="overflow-x-auto">
        <products-table
          [products]="products()"
          [deletingProductId]="deletingProductId()"
          (deleteProduct)="deleteProduct($event)"
        />
      </div>
    </div>
  }
</section>
