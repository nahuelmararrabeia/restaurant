@if (available()) {
  <span
    class="inline-flex rounded-full bg-green-100 px-2.5 py-1 text-xs font-semibold text-green-700"
  >
    Available
  </span>
} @else {
  <span
    class="inline-flex rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600"
  >
    Unavailable
  </span>
}
