<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <h2 class="font-semibold text-slate-900">Summary</h2>

  <dl class="mt-5 space-y-4">
    <div class="flex items-center justify-between gap-4">
      <dt class="text-sm text-slate-500">Table</dt>
      <dd class="text-sm font-semibold text-slate-900">
        {{ order().tableNumber }}
      </dd>
    </div>

    <div class="flex items-center justify-between gap-4">
      <dt class="text-sm text-slate-500">Products</dt>
      <dd class="text-sm font-semibold text-slate-900">
        {{ totalUnits() }}
      </dd>
    </div>

    <div class="flex items-center justify-between gap-4">
      <dt class="text-sm text-slate-500">Status</dt>
      <dd>
        <order-status-badge [status]="order().status" />
      </dd>
    </div>

    <div
      class="flex items-center justify-between gap-4 border-t border-slate-200 pt-4"
    >
      <dt class="font-semibold text-slate-900">Total</dt>
      <dd class="text-xl font-bold text-slate-900">
        {{ order().total | currency: 'ARS' : 'symbol-narrow' }}
      </dd>
    </div>
  </dl>
</div>
