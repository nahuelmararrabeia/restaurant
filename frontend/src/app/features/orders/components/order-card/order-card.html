<article
  class="flex h-full flex-col rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
>
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Order {{ order().id }}</p>

      <h2 class="mt-1 text-xl font-bold text-slate-900">Table {{ order().tableNumber }}</h2>
    </div>

    <order-status-badge [status]="order().status" />
  </div>

  <div class="mt-5 grid grid-cols-2 gap-4">
    <div>
      <p class="text-xs font-medium text-slate-400">Products</p>

      <p class="mt-1 text-sm font-semibold text-slate-700">
        {{ totalUnits() }}
      </p>
    </div>

    <div>
      <p class="text-xs font-medium text-slate-400">Total</p>

      <p class="mt-1 text-sm font-semibold text-slate-900">
        {{ order().total | currency: 'ARS' : 'symbol-narrow' : '1.2-2' }}
      </p>
    </div>
  </div>

  <div class="mt-5">
    <p class="text-xs font-medium text-slate-400">Created</p>

    <p class="mt-1 text-sm text-slate-600">
      {{ order().orderedAt | date: 'dd/MM/yyyy HH:mm' }}
    </p>
  </div>

  <div class="mt-auto pt-5">
    <div class="border-t border-slate-100 pt-4">
      <a
        [routerLink]="['/orders', order().id]"
        class="inline-flex w-full items-center justify-center rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50"
      >
        View order
      </a>
    </div>
  </div>
</article>
