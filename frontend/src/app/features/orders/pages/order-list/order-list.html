<section class="space-y-6">
  <section-header
    title="Orders"
    subtitle="Manage the orders of the restaurant"
    actionText="New order"
    [actionLink]="['/orders', 'new']"
  />

  @if (loading()) {
    <loading-state text="Loading orders..."/>
  } @else if (error()) {
    <error-state
      [text]="error()"
      buttonText="Retry"
      (onClickButton)="loadOrders()"
    />
  } @else if (orders().length === 0) {
    <empty-state
      title="No orders yet"
      subtitle="Create an order by selecting an available table."
      buttonText="Create order"
      [buttonLink]="['/orders', 'new']"
    />
  } @else {
    <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
      @for (order of orders(); track order.id) {
        <order-card [order]="order"/>
      }
    </div>
  }
</section>
