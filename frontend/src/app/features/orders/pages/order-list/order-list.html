<section class="space-y-6">
  <section-header
    title="Orders"
    subtitle="Manage the orders of the restaurant"
    actionText="New order"
    [actionLink]="['/orders', 'new']"
  />

  @if (loading()) {
    <loading-state text="Loading orders..."/>
  } @else if (error()) {
    <error-state
      [text]="error()"
      buttonText="Retry"
      (onClickButton)="loadOrders()"
    />
  } @else if (orders().length === 0) {
    <empty-state
      title="No orders yet"
      subtitle="Create an order by selecting an available table."
      buttonText="Create order"
      [buttonLink]="['/orders', 'new']"
    />
  } @else {
    <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
      @for (order of orders(); track order.id) {
        <order-card [order]="order"/>
      }
    </div>

    @if (totalPages() > 1) {
      <nav
        class="flex flex-col gap-3 rounded-xl border border-slate-200 bg-white px-5 py-4 shadow-sm sm:flex-row sm:items-center sm:justify-between"
        aria-label="Orders pagination"
      >
        <p class="text-sm text-slate-500">
          Page {{ page() }} of {{ totalPages() }}
          · {{ totalCount() }} orders
        </p>

        <div class="flex items-center gap-2">
          <button
            type="button"
            class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="page() === 1 || loading()"
            (click)="goToPage(page() - 1)"
          >
            Previous
          </button>

          <button
            type="button"
            class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="page() === totalPages() || loading()"
            (click)="goToPage(page() + 1)"
          >
            Next
          </button>
        </div>
      </nav>
    }
  }
</section>
