<section class="space-y-8">
  <section-header
    title="Dashboard"
    subtitle="verview of your restaurant activity."
  />

  @if (loading() && !statisticsData()) {
    <loading-state text="Loading dashboard..." />
  } @else if (error() && !statisticsData()) {
    <error-state
      [text]="error()"
      buttonText="Retry"
      (onClickButton)="loadDashboard()"
    />
  } @else {
    @if (error()) {
      <error-state [text]="error()" />
    }

    <section>
      <div class="grid gap-6 sm:grid-cols-2 xl:grid-cols-4">
        @for (card of statistics(); track card.title) {
          <stat-card
            [title]="card.title"
            [value]="card.value"
            [icon]="card.icon"
            [color]="card.color"
          />
        }
      </div>
    </section>

    <section class="grid gap-6 xl:grid-cols-3">
      <div class="xl:col-span-2">
        <table-status-grid
          [tables]="tables()"
        />
      </div>

      <div>
        <recent-orders
          [orders]="recentOrders()"
          (orderSelected)="openOrder($event)"
        />
      </div>
    </section>
  }
</section>
