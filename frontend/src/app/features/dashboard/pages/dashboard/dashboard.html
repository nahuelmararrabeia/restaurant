<section class="space-y-8">
  <header class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">
        Dashboard
      </h1>

      <p class="mt-1 text-sm text-slate-500">
        Overview of your restaurant activity.
      </p>
    </div>

    <button
      type="button"
      class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="loading()"
      (click)="loadDashboard()"
    >
      @if (loading()) {
        Updating...
      } @else {
        Refresh
      }
    </button>
  </header>

  @if (loading() && !statisticsData()) {
    <div
      class="rounded-xl border border-slate-200 bg-white px-6 py-16 text-center shadow-sm"
    >
      <p class="text-sm text-slate-500">
        Loading dashboard...
      </p>
    </div>
  } @else if (error() && !statisticsData()) {
    <div
      role="alert"
      class="rounded-xl border border-red-200 bg-red-50 px-5 py-4"
    >
      <p class="text-sm font-medium text-red-700">
        {{ error() }}
      </p>

      <button
        type="button"
        class="mt-4 rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700"
        (click)="loadDashboard()"
      >
        Retry
      </button>
    </div>
  } @else {
    @if (error()) {
      <div
        role="alert"
        class="rounded-xl border border-amber-200 bg-amber-50 px-5 py-4"
      >
        <p class="text-sm font-medium text-amber-700">
          {{ error() }}
        </p>
      </div>
    }

    <section>
      <div class="grid gap-6 sm:grid-cols-2 xl:grid-cols-4">
        @for (card of statistics(); track card.title) {
          <stat-card
            [title]="card.title"
            [value]="card.value"
            [icon]="card.icon"
            [color]="card.color"
          />
        }
      </div>
    </section>

    <section class="grid gap-6 xl:grid-cols-3">
      <div class="xl:col-span-2">
        <table-status-grid
          [tables]="tables()"
        />
      </div>

      <div>
        <recent-orders
          [orders]="recentOrders()"
          (orderSelected)="openOrder($event)"
        />
      </div>
    </section>
  }
</section>
