<section class="space-y-8">
  <header>
    <h1 class="text-2xl font-bold text-slate-900">
      Dashboard
    </h1>

    <p class="mt-1 text-sm text-slate-500">
      Overview of your restaurant activity.
    </p>
  </header>

  <section>
    <div class="grid gap-6 sm:grid-cols-2 xl:grid-cols-4">
      @for (card of statistics(); track card.title) {
        <stat-card
          [title]="card.title"
          [value]="card.value"
          [icon]="card.icon"
          [color]="card.color"
        />
      }
    </div>
  </section>

  <section class="grid gap-6 xl:grid-cols-3">
    <div class="xl:col-span-2">
      <table-status-grid [tables]="tables()" />
    </div>
    <div class="xl:col-span-2">
      <recent-orders
        [orders]="recentOrders()"
        (orderSelected)="openOrder($event)"
      />
    </div>
  </section>
</section>
