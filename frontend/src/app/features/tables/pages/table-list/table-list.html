<section class="space-y-6">
  <section-header
    title="Tables"
    subtitle="Manage the capacity and availability of the tables"
    actionText="Add table"
    [actionLink]="['/tables', 'new']"
  />

  @if (actionError()) {
    <error-state
      [text]="actionError()"
      buttonText="×"
      (onClickButton)="clearActionError()"

    />
  }

  @if (loading()) {
    <loading-state text="Loading tables..." />
  } @else if (error()) {
    <error-state
      [text]="error()"
      buttonText="Retry"
      (onClickButton)="loadTables()"
     />
  } @else if (tables().length === 0) {
    <empty-state
      title="No tables yet"
      subtitle="Create the first table to start managing the restaurant."
      buttonText="Create table"
      [buttonLink]="['/tables', 'new']"
    />
  } @else {
    <table-floor-plan
      [tables]="tables()"
      [savingTableId]="positionSavingId()"
      [actionInProgressId]="actionInProgress()"
      (positionChange)="updateTablePosition($event)"
      (createOrder)="createOrder($event)"
      (enableTable)="enableTable($event)"
      (disableTable)="disableTable($event)"
      (deleteTable)="deleteTable($event)"
    />

    <details
      class="group mt-6 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
    >
      <summary
        class="flex cursor-pointer list-none items-center justify-between px-5 py-4 font-semibold text-slate-900 transition hover:bg-slate-50"
      >
        <span>Table list ({{ tables().length }})</span>
        <span
          class="text-slate-400 transition-transform group-open:rotate-180"
          aria-hidden="true"
        >
          &#x25BC;
        </span>
      </summary>

      <div
        class="grid gap-4 border-t border-slate-200 p-4 sm:grid-cols-2 xl:grid-cols-3"
      >
        @for (table of tables(); track table.id) {
          <table-card
            [table]="table"
            [canDelete]="canDelete(table)"
            [isActionInProgress]="isActionInProgress(table.id)"
            (onClickCreateOrder)="createOrder(table)"
            (onClickDelete)="deleteTable(table)"
            (onClickEnable)="enableTable(table)"
            (onClickDisable)="disableTable(table)"
          />
        }
      </div>
    </details>
  }
</section>
