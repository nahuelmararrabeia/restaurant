<section class="mx-auto max-w-3xl space-y-6">
  <subsection-header
    title="Edit table"
    subtitle="Edit the number and the capacity of the table."
    backButtonText="Go back to Tables"
    (onBackButtonClick)="cancel()"
  />

  @if (loading()) {
    <loading-state text="Loading table..."/>
  } @else if (loadError()) {
    <error-state
      [text]="loadError()"
      buttonText="Retry"
      (onClickButton)="retry()"
     />
  } @else if (table(); as currentTable) {
    @if (saveError()) {
      <error-state [text]="saveError()" />
    }

    <div
      class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
    >
      <table-form
        [initialValue]="currentTable"
        [loading]="saving()"
        (save)="updateTable($event)"
        (cancel)="cancel()"
      />
    </div>
  }
</section>
