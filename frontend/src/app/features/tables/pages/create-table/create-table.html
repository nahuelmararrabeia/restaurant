<section class="mx-auto max-w-3xl space-y-6">
  <subsection-header
    title="Create table"
    subtitle="Add a new table to the restaurant."
    backButtonText="Go back to Tables"
    (onBackButtonClick)="cancel()"
  />

  @if (error()) {
    <error-state [text]="error()" />
  }

  <div
    class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
  >
    <table-form
      [loading]="saving()"
      (save)="createTable($event)"
      (cancel)="cancel()"
    />
  </div>
</section>
