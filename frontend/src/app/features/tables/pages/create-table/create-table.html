<section class="mx-auto max-w-3xl space-y-6">
  <header>
    <button
      type="button"
      class="mb-4 inline-flex items-center gap-2 text-sm font-semibold text-slate-500 transition hover:text-slate-900"
      (click)="cancel()"
    >
      <span aria-hidden="true">←</span>
      Volver a mesas
    </button>

    <h1 class="text-2xl font-bold text-slate-900">
      Crear mesa
    </h1>

    <p class="mt-1 text-sm text-slate-500">
      Agregá una nueva mesa al salón.
    </p>
  </header>

  @if (error()) {
    <div
      role="alert"
      class="rounded-xl border border-red-200 bg-red-50 px-4 py-3"
    >
      <p class="text-sm font-medium text-red-700">
        {{ error() }}
      </p>
    </div>
  }

  <div
    class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
  >
    <table-form
      [loading]="saving()"
      (save)="createTable($event)"
      (cancel)="cancel()"
    />
  </div>
</section>
